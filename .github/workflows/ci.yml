name: CI
on: [push, pull_request]
jobs:
    build-test:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - run: sudo apt-get update && sudo apt-get install -y cmake g++
            - run: cmake -S arraylib -B arraylib/build
            - run: cmake --build arraylib/build -j
            - run: cmake --build arraylib/build --target variant_25
            - run: cd arraylib/build && ctest --output-on-failure